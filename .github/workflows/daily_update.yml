name: Daily Stock Data Update

on:
  schedule:
    # 1. 아침 06:30 KST (UTC 21:30, 화~토) -> 장 마감 확정치 반영
    - cron: '30 21 * * 1-5'
    # 2. 밤 23:00 KST (UTC 14:00, 월~금) -> 본장 시작 시세 반영
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # 언제든 수동으로 즉시 갱신할 수 있는 버튼

permissions:
  contents: write # data.json을 업데이트하여 커밋/푸시할 수 있는 권한

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: 데이터 수집 및 지표 계산 스크립트 실행
        run: |
          python collector.py

      - name: 변경된 data.json 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto Update: Stock data updated [skip ci]" || echo "No changes to commit"
          git push
